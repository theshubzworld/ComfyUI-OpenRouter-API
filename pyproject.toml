[project]
name = "ComfyUI-OpenRouter-API"
description = "A bounded multimodal OpenRouter node for ComfyUI with text-only output."
version = "1.0.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9,<4",
    "numpy>=1.26",
    "Pillow>=10,<13",
]
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/theshubzworld/ComfyUI-OpenRouter-API"
#  Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
PublisherId = "theshubzworld"
DisplayName = "ComfyUI-OpenRouter-API"
Icon = "https://avatars.githubusercontent.com/u/176368083"
requires-comfyui = ">=0.32.0"
